<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#120b1f">
<title>Joetopia: Ashes of Canaan</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="css/style.css?v=202610262055">
</head>
<body>
<div id="app">
  <nav id="menubar" aria-label="Game menu">
    <div class="dd" data-dd="here"><button class="mb" id="btnHere" title="Actions here (H)">📍<span>Here</span> ▾</button><div class="dd-menu" id="ddHere"></div></div>
    <button class="mb" id="btnGear" title="Inventory & gear (I)">🎒<span>Gear</span></button>
    <button class="mb" id="btnStats" title="Stats (C)">📊<span>Stats</span></button>
    <button class="mb" id="btnQuests" title="Quests (J)">📜<span>Quests</span></button>
    <div class="dd" data-dd="stream"><button class="mb" id="btnStream" title="Stream (V)">📺<span>Stream</span> ▾</button><div class="dd-menu" id="ddStream"></div></div>
    <button class="mb" id="btnMyco" title="Mushrooms (M)">🍄<span>Mushrooms</span></button>
    <div class="dd" data-dd="save"><button class="mb" id="btnSave" title="Save / Load">💾<span>Save</span> ▾</button><div class="dd-menu" id="ddSave"></div></div>
    <div class="dd" data-dd="settings"><button class="mb" id="btnSettings" title="Settings">⚙<span>Settings</span> ▾</button><div class="dd-menu right" id="ddSettings"></div></div>
  </nav>
  <div id="hud"></div>
  <main id="stage">
    <canvas id="cv" width="640" height="480" aria-label="Game map"></canvas>
    <div id="banner"></div>
    <div id="prompt"></div>
    <div id="msg" class="hidden" role="dialog"><div id="msgText"></div><div class="hint">Ⓐ / Enter / tap to continue</div></div>
    <div id="toast"></div>
  </main>
  <div id="pad">
    <div id="dpad">
      <button data-dir="up" aria-label="Up">▲</button>
      <button data-dir="left" aria-label="Left">◀</button>
      <button data-dir="right" aria-label="Right">▶</button>
      <button data-dir="down" aria-label="Down">▼</button>
    </div>
    <div id="abtns"><button id="bBtn" aria-label="Menu">B</button><button id="aBtn" aria-label="Act">A</button></div>
  </div>
</div>
<div id="overlay" class="hidden"><div id="panel"></div></div>
<script>window.JOETOPIA_BUILD = '202610262055'; // stamped by tools/stamp-build.py: busts browser caches on every release</script>
<script src="engine/joetopia-engine.js?v=202610262055"></script>
<script src="data/world.js?v=202610262055"></script>
<script src="data/art.js?v=202610262055"></script>
<script src="data/maps.js?v=202610262055"></script>
<script src="data/ui.js?v=202610262055"></script>
<script src="js/art.js?v=202610262055"></script>
<script src="js/map.js?v=202610262055"></script>
<script src="js/ui.js?v=202610262055"></script>
<script src="js/game.js?v=202610262055"></script>
</body>
</html>
